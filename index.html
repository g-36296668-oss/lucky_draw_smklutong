#school::before{content:"";position:absolute;right:0;top:0;bottom:0;width:18%;background:linear-gradient(270deg,#fdfcf7,rgba(253,252,247,0))}
#gl,#paper{position:absolute;inset:0;width:100%;height:100%;display:block}
.doodle{position:absolute;pointer-events:none;font-family:"Gochi Hand",cursive;opacity:.85}
.title{position:absolute;right:2.4cqw;top:1.4cqw;pointer-events:none;text-align:right}
.title .t1{font-family:"Gochi Hand",cursive;font-size:5.2cqw;line-height:1}
.title .t1 span:nth-child(5n+1){color:#D85A30}.title .t1 span:nth-child(5n+2){color:#185FA5}.title .t1 span:nth-child(5n+3){color:#3B6D11}.title .t1 span:nth-child(5n+4){color:#993556}.title .t1 span:nth-child(5n){color:#BA7517}
.status{display:inline-block;margin-top:.6cqw;font-size:max(11px,1.7cqw);background:#FAEEDA;color:#633806;border:.2cqw dashed #BA7517;padding:.2cqw 1.2cqw;border-radius:5cqw}
.finish{position:absolute;left:37.5%;top:9%;height:52%;width:1cqw;transform:translateX(-50%);
  background:repeating-linear-gradient(180deg,#2C2C2A 0 1cqw,transparent 1cqw 2cqw);border-left:.15cqw solid #2C2C2A;border-right:.15cqw solid #2C2C2A;pointer-events:none;opacity:.85}
.finish span{position:absolute;top:-3.6cqw;left:50%;transform:translateX(-50%) rotate(-4deg);background:#E24B4A;color:#fff;font-size:2.2cqw;padding:0 1.2cqw;border-radius:.8cqw;white-space:nowrap}
.lbl{position:absolute;left:0;top:0;font-size:max(10px,1.55cqw);background:#fff;color:#2C2C2A;border:.18cqw solid #E24B4A;border-radius:1cqw;padding:0 .7cqw;white-space:nowrap;pointer-events:none;display:none;transform:translate(-50%,-150%)}
#board{position:absolute;z-index:2;right:2%;bottom:14.5%;width:57%;top:55%;background:#fff;border:.35cqw dashed #185FA5;border-radius:2cqw;padding:1.2cqw 2cqw;transform:rotate(.6deg)}
#board h3{margin:0 0 .4cqw;font-size:2.5cqw;font-weight:400;color:#185FA5;display:flex;justify-content:space-between;align-items:baseline;font-family:"Gochi Hand",cursive}
#board h3 small{font-size:1.7cqw;color:#5f5e5a}
#board .empty{font-size:2cqw;color:#888780;margin-top:1.6cqw;text-align:center}
#board ol{margin:0;padding:0;list-style:none;display:grid;grid-template-columns:1fr 1fr;gap:.1cqw 2cqw;font-size:1.95cqw;line-height:1.12}
#board li{display:flex;gap:.8cqw;white-space:nowrap;overflow:hidden}
#board li b{color:#D85A30;min-width:3.4cqw;font-weight:400}
#board li span{overflow:hidden;text-overflow:ellipsis;color:#2C2C2A}
.bar{display:flex;gap:8px;margin:12px 0;flex-wrap:wrap}
button{font:inherit;font-size:15px;border:1px solid #c9c6bc;background:#fff;border-radius:10px;padding:10px 16px;cursor:pointer;min-height:44px}
button.main{flex:1;background:#185FA5;border-color:#185FA5;color:#fff;font-weight:600}
button:active{transform:scale(.98)}
.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
@media (max-width:700px){.grid{grid-template-columns:minmax(0,1fr)}}
.card{background:#fff;border:1px solid #e3e0d6;border-radius:12px;padding:12px 14px}
label,.muted{font-size:13px;color:#5f5e5a}
textarea{width:100%;font:inherit;font-size:14px;border:1px solid #d3d1c7;border-radius:8px;padding:8px;margin-top:6px;resize:vertical}
input[type=number]{font:inherit;width:70px;padding:6px;border:1px solid #d3d1c7;border-radius:8px}
.err{color:#A32D2D;font-size:13px;min-height:18px;margin-top:4px}
#hist{font-size:14px;line-height:1.7;margin-top:6px;white-space:pre-line}
</style>
</head>
<body>
<div class="page">
  <div id="stage"><div id="scene">
    <canvas id="paper"></canvas>
    <div id="school"></div>
    <div class="doodle" style="left:55%;top:4%;font-size:3cqw;color:#FAC775">&#9733;</div>
    <div class="doodle" style="left:45%;top:62%;font-size:2.4cqw;color:#ED93B1">&#9829;</div>
    <div class="doodle" style="left:63%;top:10%;font-size:2cqw;color:#85B7EB">&#9733;</div>
    <canvas id="gl"></canvas>
    <div class="finish"><span>FINISH</span></div>
    <div class="title"><div class="t1" id="tt"></div><div class="status" id="st">Masukkan nama untuk mula</div></div>
    <div id="board"><h3>Pemenang <small id="bsub"></small></h3><ol id="blist"></ol><div class="empty" id="bempty">Nama pemenang akan muncul di sini</div></div>
  </div></div>

  <div class="bar">
    <button class="main" id="go">Lancar kapal terbang</button>
    <button id="fs">Skrin penuh</button>
    <button id="rs">Set semula</button>
  </div>
  <div class="err" id="err"></div>

  <div class="grid">
    <div class="card">
      <label for="names">Senarai nama (satu nama satu baris). Nama yang menang akan dibuang dari senarai.</label>
      <textarea id="names" rows="10" placeholder="Aisyah&#10;Ahmad&#10;Mei Ling&#10;Raj"></textarea>
      <div class="muted" id="cnt">0 nama</div>
      <div style="margin-top:10px"><label for="nw">Bilangan pemenang setiap pusingan</label>
        <input id="nw" type="number" min="1" max="20" step="1" value="10"></div>
    </div>
    <div class="card">
      <div class="muted">Semua pemenang setakat ini</div>
      <div id="hist" class="muted">Belum ada</div>
      <button id="cp" style="margin-top:10px">Salin senarai pemenang</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=id=>document.getElementById(id);

$('tt').innerHTML='Cabutan Bertuah!'.split('').map(c=>'<span>'+(c===' '?'&nbsp;':c)+'</span>').join('');
const scn=$('scene'),cvs=$('gl');
const ren=new THREE.WebGLRenderer({canvas:cvs,antialias:true,alpha:true});
ren.setPixelRatio(Math.min(devicePixelRatio||1,2));ren.setClearColor(0x000000,0);
const scene=new THREE.Scene();
const CAMZ=40,ASP=16/9,FOV=2*Math.atan(15/CAMZ);
const cam=new THREE.PerspectiveCamera(FOV*180/Math.PI,ASP,0.1,200);cam.position.set(0,0,CAMZ);cam.lookAt(0,0,0);
scene.add(new THREE.HemisphereLight(0xffffff,0xd8d4c8,0.9));
const sun=new THREE.DirectionalLight(0xffffff,0.7);sun.position.set(-6,10,12);scene.add(sun);
function fit(){ren.setSize(scn.clientWidth,scn.clientHeight,false);}
new ResizeObserver(fit).observe(scn);fit();
/*paper*/
const pc=$('paper'),px=pc.getContext('2d');
function drawPaper(){
  const d=Math.min(devicePixelRatio||1,2),W=scn.clientWidth,H=scn.clientHeight;
  pc.width=W*d;pc.height=H*d;px.setTransform(-d,0,0,d,W*d,0);px.clearRect(0,0,W,H);
  let seed=7;const R=()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};
  const u=W/100;
  function crayon(pts,col,w,passes=3,al=.38){px.lineCap='round';px.lineJoin='round';
    for(let k=0;k<passes;k++){px.globalAlpha=al;px.strokeStyle=col;px.lineWidth=w*(.7+R()*.5);px.beginPath();
      pts.forEach((q,i)=>{const x=q[0]+(R()-.5)*w*.9,y=q[1]+(R()-.5)*w*.9;i?px.lineTo(x,y):px.moveTo(x,y);});px.stroke();}
    px.globalAlpha=1;}
  function seg(x1,y1,x2,y2,n=6){const a=[];for(let i=0;i<=n;i++)a.push([x1+(x2-x1)*i/n,y1+(y2-y1)*i/n]);return a;}
  function cloud(cx,cy,cw){
    const pts=[];for(let i=0;i<=72;i++){const th=i/72*Math.PI*2,bump=.78+.22*Math.abs(Math.sin(th*3.5+.4));
      const sy=Math.sin(th);pts.push([cx+Math.cos(th)*cw*bump,cy+sy*cw*.48*bump*(sy>0?.55:1)]);}
    px.save();px.beginPath();pts.forEach((q,i)=>i?px.lineTo(q[0],q[1]):px.moveTo(q[0],q[1]));px.closePath();
    px.fillStyle='#ffffff';px.fill();px.clip();
    for(let x=cx-cw*1.6;x<cx+cw*1.6;x+=u*.55)crayon(seg(x,cy+cw*.6,x+cw*.5,cy-cw*.6,3),'#B5D4F4',u*.35,1,.45);
    px.restore();crayon(pts,'#378ADD',u*.32,3,.45);
  }
  [[50,11,4.8],[13,33,6.5],[33,44,5],[51,36,4.2],[28,25,3.4]].forEach(c=>cloud(c[0]*u,c[1]*H/100,c[2]*u));
  [[38,16],[41,18.5],[22,40]].forEach(b=>{const x=b[0]*u,y=b[1]*H/100;crayon([[x-u,y-u*.4],[x,y+u*.2],[x+u,y-u*.4]],'#2C2C2A',u*.18,2,.6);});
  const fy=H*.86,gx=62*u;
  for(let x=0;x<gx;x+=u*.9)crayon(seg(x,fy-u*2.6,x+u*2.6,fy+u*0.1,2),'#3B6D11',u*.12,1,.55);
  for(let x=0;x<gx;x+=u*.9)crayon(seg(x+u*2.6,fy-u*2.6,x,fy+u*0.1,2),'#3B6D11',u*.12,1,.55);
  crayon(seg(0,fy-u*2.7,gx,fy-u*2.7,20),'#27500A',u*.3,3,.5);
  for(let x=u;x<gx;x+=u*4.2)crayon(seg(x,fy-u*3.1,x,fy+u*.6,3),'#27500A',u*.38,3,.55);
  const G=['#3B6D11','#639922','#97C459','#C0DD97','#639922'];
  for(let i=0;i<900;i++){const x=R()*gx,y=fy+R()*(H-fy)+u*.4,h=u*(1+R()*2.2);crayon([[x,y],[x+(R()-.3)*u*.8,y-h]],G[i%5],u*.22,1,.55);}
  [[8,95,'#F0997B'],[22,97,'#ED93B1'],[37,95,'#AFA9EC'],[50,97,'#FAC775']].forEach(f=>{const x=f[0]*u,y=f[1]*H/100,r=u*.6;
    crayon([[x,y+r],[x,y+r*3]],'#3B6D11',u*.2,2,.6);
    for(let k=0;k<5;k++){const a=k/5*Math.PI*2;px.globalAlpha=.75;px.fillStyle=f[2];px.beginPath();px.arc(x+Math.cos(a)*r,y+Math.sin(a)*r,r*.7,0,7);px.fill();}
    px.fillStyle='#EF9F27';px.beginPath();px.arc(x,y,r*.45,0,7);px.fill();px.globalAlpha=1;});
}
new ResizeObserver(drawPaper).observe(scn);drawPaper();


const g=new THREE.BufferGeometry();
g.setAttribute('position',new THREE.Float32BufferAttribute([0.6,0,0,-0.6,0,0,-0.6,0.12,-0.45, 0.6,0,0,-0.6,0.12,0.45,-0.6,0,0, 0.6,0,0,-0.6,0,0,-0.55,-0.18,0],3));g.computeVertexNormals();
const edgeG=new THREE.EdgesGeometry(g);const edgeM=new THREE.LineBasicMaterial({color:0x444441});
const PAPER=['#85B7EB','#F0997B','#97C459','#FAC775','#AFA9EC','#ED93B1','#5DCAA5'].map(c=>new THREE.MeshStandardMaterial({color:c,side:THREE.DoubleSide,flatShading:true,roughness:0.85}));

const STARTX=1.04,FINX=0.375,GATE={x:0.375*0.27,y:0.73};
let P=[],running=false,fin=[],allW=[],K=10,t=0,labels=[],round=0;
function rnd(){const a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]/4294967296;}
function lines(){return $('names').value.split('\n').map(s=>s.trim()).filter(Boolean);}
function esc(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function short(s){return s.length>14?s.slice(0,13)+'…':s;}
function toWorld(sx,sy,z){const d=CAMZ-z,hh=Math.tan(FOV/2)*d,hw=hh*ASP;return[(sx*2-1)*hw,(1-sy*2)*hh,z];}
function mkLabels(){labels.forEach(l=>l.remove());labels=[];for(let i=0;i<K;i++){const d=document.createElement('div');d.className='lbl';scn.appendChild(d);labels.push(d);}}
function count(){const n=lines().length;$('cnt').textContent=n+' nama';return n;}
function setup(){
  P.forEach(p=>scene.remove(p.m));
  P=lines().map((name,i)=>{
    const m=new THREE.Mesh(g,PAPER[Math.floor(rnd()*PAPER.length)]);m.add(new THREE.LineSegments(edgeG,edgeM));m.scale.setScalar(1.5);scene.add(m);
    const sy=0.2+rnd()*0.38;
    return{id:i,name,m,sx:1.02+rnd()*0.08,sy0:sy,sy,z:(sy-0.2)/0.38*8-3+(rnd()-0.5)*3,ph:rnd()*6.3,f:0.04+rnd()*0.04,base:0.85+rnd()*0.3,v:1,done:false,sc:1};
  });
  fin=[];$('blist').innerHTML='';$('bempty').style.display='block';$('bsub').textContent='';mkLabels();
}
function ready(){const n=count();$('st').textContent=n?n+' kapal terbang sedia':'Masukkan nama untuk mula';
  P.forEach(p=>{p.sx=0.91+rnd()*0.07;});}
function toGate(p){p.sx+=(GATE.x-p.sx)*0.035;p.sy0+=(GATE.y-p.sy0)*0.035;p.sc*=0.972;}
function step(){
  const unit=(STARTX-FINX)/560;
  P.forEach(p=>{
    if(p.done){toGate(p);return;}
    p.v+=(rnd()-0.5)*0.22;if(rnd()<0.004)p.v+=0.9;p.v=Math.max(0.35,Math.min(2.1,p.v));
    p.sx-=p.v*p.base*unit;
    if(p.sx<=FINX){p.done=true;if(fin.length<K){fin.push(p);showWins();}}
  });
  if(fin.length>=Math.min(K,P.length)){running=false;finish();}
}
function loop(){
  t++;if(running)step();else P.forEach(p=>{if(p.done)toGate(p);});
  P.forEach(p=>{
    p.sy=p.sy0+(p.done?0:Math.sin(t*p.f+p.ph)*0.008);
    const w=toWorld(p.sx,p.sy,p.z);p.m.position.set(w[0],w[1],w[2]);
    p.m.visible=p.sc>0.08;p.m.scale.setScalar(1.5*p.sc);
    p.m.rotation.set(Math.sin(t*p.f*0.7+p.ph)*0.25,Math.PI,Math.cos(t*p.f+p.ph)*0.15);
  });
  ren.render(scene,cam);
  const tagged=running?P.filter(p=>!p.done).sort((a,b)=>a.sx-b.sx).slice(0,Math.max(0,K-fin.length)):[];
  labels.forEach((l,i)=>{const p=tagged[i];if(!p){l.style.display='none';return;}
    l.style.display='block';l.textContent=short(p.name);l.style.left=(p.sx*100)+'%';l.style.top=(p.sy*100)+'%';});
  requestAnimationFrame(loop);
}
function showWins(){
  $('bempty').style.display='none';$('bsub').textContent='Pusingan '+round;
  $('blist').innerHTML=fin.map((p,i)=>'<li><b>#'+(i+1)+'</b><span>'+esc(p.name)+'</span></li>').join('');
  $('st').textContent=fin.length+' / '+K+' pemenang';
}
function finish(){
  const ids=new Set(fin.map(p=>p.id));
  allW.push(...fin.map(p=>p.name));
  $('names').value=lines().filter((_,i)=>!ids.has(i)).join('\n');
  P=P.filter(p=>{if(!ids.has(p.id)){scene.remove(p.m);return false;}return true;});
  count();
  $('hist').textContent=allW.map((n,i)=>(i+1)+'. '+n).join('\n');$('hist').classList.remove('muted');
  $('st').textContent='Tahniah! Baki '+lines().length+' nama';
  $('go').textContent='Pusingan seterusnya';
}
$('names').addEventListener('input',()=>{$('err').textContent='';if(!running){setup();ready();}});
$('nw').addEventListener('input',()=>{$('err').textContent='';});
$('go').onclick=()=>{
  if(running)return;
  const nw=parseInt($('nw').value,10);
  if(lines().length<1){$('err').textContent='Senarai nama kosong. Masukkan nama dahulu.';return;}
  if(!nw||nw<1){$('err').textContent='Masukkan bilangan pemenang.';return;}
  K=Math.min(nw,lines().length);setup();
  $('err').textContent=K<nw?'Hanya tinggal '+K+' nama, jadi '+K+' pemenang.':'';
  round++;running=true;$('st').textContent='Kapal terbang dilancarkan!';
};
$('rs').onclick=()=>{running=false;allW=[];round=0;$('hist').textContent='Belum ada';$('hist').classList.add('muted');$('err').textContent='';
  $('go').textContent='Lancar kapal terbang';setup();ready();};
$('fs').onclick=()=>{const s=$('stage');
  try{if(document.fullscreenElement){document.exitFullscreen();}else if(s.requestFullscreen){s.requestFullscreen().catch(()=>{$('err').textContent='Skrin penuh tidak dibenarkan di sini. Cuba buka page ini dalam tab sendiri.';});}
  else if(s.webkitRequestFullscreen){s.webkitRequestFullscreen();}}catch(e){$('err').textContent='Skrin penuh tidak dibenarkan di sini.';}};
document.addEventListener('fullscreenchange',()=>{$('fs').textContent=document.fullscreenElement?'Keluar skrin penuh':'Skrin penuh';});
document.addEventListener('keydown',e=>{const tg=document.activeElement.tagName;if(e.key===' '&&tg!=='TEXTAREA'&&tg!=='INPUT'){e.preventDefault();$('go').click();}});
$('cp').onclick=()=>{const txt=allW.map((n,i)=>(i+1)+'. '+n).join('\n');
  if(!txt){$('err').textContent='Belum ada pemenang untuk disalin.';return;}
  navigator.clipboard.writeText(txt).then(()=>{$('cp').textContent='Disalin';setTimeout(()=>$('cp').textContent='Salin senarai pemenang',1500);}).catch(()=>{$('err').textContent='Tidak dapat salin. Pilih dan salin senarai secara manual.';});};
setup();ready();loop();
</script>
</body>
</html>
